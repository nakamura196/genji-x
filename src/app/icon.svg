<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 32" width="32" height="32">
  <!--
    favicon。ヘッダのロゴと同じ源氏香の図（第2帖「帚木」）。
    タブの小さな表示でも形が残るよう、線をやや太くしてある。
    色は固定値。CSS 変数はここでは効かない。
  -->
  <rect width="30" height="32" fill="none"/>
  <g stroke="#95612b" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="27" y1="6" x2="27" y2="27"/>
    <line x1="21" y1="6" x2="21" y2="27"/>
    <line x1="15" y1="6" x2="15" y2="27"/>
    <line x1="9"  y1="6" x2="9"  y2="27"/>
    <line x1="3"  y1="6" x2="3"  y2="27"/>
    <line x1="27" y1="10" x2="21" y2="10"/>
    <line x1="15" y1="10" x2="3"  y2="10"/>
  </g>
</svg>
