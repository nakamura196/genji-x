name: Deploy

# main に入ったら Cloudflare Workers へ配る。
#
# ── なぜ CI から配るのか ────────────────────────────────────────
# 1. **追跡していないファイルが出ていかない。** 手元から配ると、実験用の写しや
#    測定スクリプトが混ざっても気づけない。CI は clone した状態から作る。
#
# 2. **資産と HTML が食い違わない。** ここが実際に効いた。
#    手元で `next build` を何度か走らせたあと配ったところ、**HTML が参照する
#    JS/CSS が 404 になった**（Turbopack は毎回ちがう名前で塊を作るので、
#    古い `.next` が残っていると組み合わせがずれる）。
#    毎回まっさらから作れば、この種の事故は構造的に起きない。
#
# ── ビルドが外に触るところ ──────────────────────────────────────
# prebuild が 2 つ動く。
#   build-snapshot.mjs    公開 RPC から 55 件のメタデータを読む（鍵は要らない）
#   build-tei-facets.mjs  素材の TEI を数える → 別リポジトリなので checkout する
#
# どちらも読むだけで、秘密を必要としない。秘密は配布の 1 手だけ。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に 2 本走らせない。あとから来たほうを待たせる（配布の取り消しは面倒）
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 素材の TEI。巻名・行数・和歌の数をここから数える（チェーンには載せていない）
      - name: 素材の TEI を取る
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kouigenjimonogatari/kouigenjimonogatari.github.io
          path: kouigenji
          # 巻名と seg しか見ないので、履歴は要らない
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 既知の脆弱性がある依存のまま配らない
      - name: Audit
        run: npm audit --audit-level=high
        # 手動起動 (dependabot-security-merge.yml からの起動を含む) では止めない。
        # 脆弱性が残っていると、それを減らす修正まで配れなくなるため。
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}

      - run: npx tsc --noEmit

      # **`next build` ではなく OpenNext の build を呼ぶ。**
      # opennextjs-cloudflare deploy は「組み立て済みの設定」を要求する。
      # `npm run build` (= next build) だけだとそれが作られず、
      # 配る段で「Could not find compiled Open Next config」で落ちる。
      #
      # この 1 本で prebuild (チェーンと TEI の読み取り) → next build →
      # Worker の梱包 まで走るので、二重に build しない。
      - name: ビルドと梱包
        env:
          GENJI_TEI_DIR: ${{ github.workspace }}/kouigenji/xml/master
        run: npx opennextjs-cloudflare build

      # 出したものが意図どおりか、配る前に確かめる
      - name: 出来上がりの点検
        run: |
          test -f .open-next/worker.js || { echo '::error::Worker が組み立てられていません'; exit 1; }
          node -e "
            const fs = require('fs');
            const f = require('./src/data/tei-facets.json');
            if (Object.keys(f.volumes).length !== 54) throw new Error('帖が 54 件ではない');
            if (!f.volumes['01'].titleAlt) throw new Error('巻名の漢字が取れていない');
            const s = require('./src/data/snapshot.json');
            if (s.assets.length !== 55) throw new Error('資産が 55 件ではない');
            const withName = s.assets.filter(a => /中村|Nakamura/.test(JSON.stringify(a.ddo))).length;
            if (withName) throw new Error('チェーンの記録に氏名が入っている: ' + withName + ' 件');
            console.log('点検 OK  54 帖 / 55 件 / 氏名なし');
          "

      - name: Cloudflare Workers へ配る
        env:
          # Workers Scripts (Edit) と Workers Routes (Edit) を持つトークン。
          # 独自ドメイン (genji-x.ldas.jp) の割り当てに Routes 側が要る。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: 配ったものが応答するか
        run: |
          # 動的な区間 (contract / tx) も必ず見る。ここを見ていなかったので、
          # 契約の画面が 404 のまま配られていた
          #
          # GitHub のサーバ (データセンターの IP) からだと、ldas.jp の Cloudflare の
          # bot 対策に弾かれて 403 が返ることがある (2026-10-01 から。手元からは 200)。
          # ゾーン全体の守りは緩めず、Cloudflare に弾かれた 403 だけは警告にとどめる。
          # 見分けは cf-mitigated ヘッダか、Cloudflare のチャレンジ／ブロック画面の本文。
          # それ以外の 403 (アプリ自身が返したもの) と 200 以外は、これまでどおり失敗。
          tmp=$(mktemp -d)
          ok=0; blocked=0
          for p in /ja /en /ja/search /ja/publisher /ja/how-to /ja/asset/01 \
                   /ja/contract/0x8197bd3d263b9dcf68df1e2629459f01e0cfcab9 \
                   /ja/tx/0xea95b38eebe2f5752474e3d003b205da4d51f0edda79e748446a82fc758964c1 \
                   /.well-known/genji-witness.json; do
            code=$(curl -s -D "$tmp/h" -o "$tmp/b" -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "https://genji-x.ldas.jp$p")
            if [ "$code" = "200" ]; then
              printf '  %-38s %s\n' "$p" "$code"; ok=$((ok+1)); continue
            fi
            if [ "$code" = "403" ] && { grep -qi '^cf-mitigated:' "$tmp/h" || grep -qiE 'cf-chl|challenge-platform|Attention Required! \| Cloudflare|Just a moment' "$tmp/b"; }; then
              printf '  %-38s %s (Cloudflare に弾かれた。未確認)\n' "$p" "$code"
              echo "::warning title=配布後の確認::$p は Cloudflare の bot 対策で 403。GitHub からは確かめられないので、手元から開いて確認する"
              blocked=$((blocked+1)); continue
            fi
            printf '  %-38s %s\n' "$p" "$code"
            echo "--- 応答ヘッダ ---"; cat "$tmp/h"
            exit 1
          done
          echo "200: $ok 件 / Cloudflare に弾かれて未確認: $blocked 件"
