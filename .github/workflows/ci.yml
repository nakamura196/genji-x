name: CI

# PR の門番。**配る前に落とす**ことが目的なので、deploy.yml と同じ工程を踏む。
# 違いは最後の「配る」を持たないことと、画面のテストを走らせること。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 素材の TEI を取る
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kouigenjimonogatari/kouigenjimonogatari.github.io
          path: kouigenji
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
        # Dependabot の PR では失敗させない。一部の脆弱性だけを直す更新でも、
        # 残りの脆弱性で落ちて取り込めなくなるため。取り込むかどうかは
        # dependabot-security-merge.yml が更新前後の件数で判定する。
        continue-on-error: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
      - run: npx tsc --noEmit
      - run: npx eslint

      # ブラウザ名をここに書かない。playwright.config.ts の projects と二重になり、
      # こちらが古くなる（mobile = iPhone 14 は WebKit なのに chromium だけ入れていて、
      # mobile のテストが全部起動前に落ちていた）。どれが要るかは config が決める
      - name: ブラウザを取る
        run: npx playwright install --with-deps

      - name: 画面のテスト
        env:
          GENJI_TEI_DIR: ${{ github.workspace }}/kouigenji/xml/master
        # 開発サーバは playwright.config.ts の webServer が立てる。
        # 並列数は runner の CPU に合わせて控えめに（詰めると落ちる）
        run: npx playwright test --workers=2

      - name: 失敗したときの画面を残す
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
